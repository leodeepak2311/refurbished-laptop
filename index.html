function register(){const name=$("#name").value.trim(),mobile=$("#mobile").value.trim(),email=$("#email").value.trim(),pass=$("#pass").value;if(!name||mobile.length!==10||!email.includes("@")||pass.length<6)return toast("Please enter valid details. Password needs 6+ characters.");db.user={name,mobile,email,pass};db.loggedIn=true;save();toast("Account created successfully");renderHome()}

function nav(page="home"){page=page.toLowerCase();if(page==="home")renderHome();else if(page==="search")renderSearch();else if(page==="cart")renderCart();else if(page==="wishlist")renderWishlist();else if(page==="orders")renderOrders();else if(page==="profile")renderProfile();else if(page==="sell")renderSell();else if(page==="upload")renderUpload();else if(page==="compare")renderCompare();else if(page==="checkout")renderCheckout()}
function shell(content){
return `<div class="shell"><header class="topbar">${logo()}<div class="searchbox"><span class="search-icon">⌕</span><input placeholder="Search laptops, MacBooks, brands or models..." onkeydown="if(event.key==='Enter')searchFromHeader(this.value)"></div><nav class="desktop-nav"><button onclick="nav('home')">Home</button><button onclick="nav('search')">Search</button><button onclick="nav('sell')">Sell Laptop</button><button onclick="nav('upload')">Upload</button><button onclick="nav('orders')">Orders</button><button onclick="nav('wishlist')">♡ ${db.wishlist.length}</button><button onclick="nav('cart')">🛒 ${db.cart.reduce((a,b)=>a+b.qty,0)}</button><button onclick="nav('profile')">Profile</button></nav></header><main class="main">${content}</main><div class="bottom-nav"><button onclick="nav('home')">🏠<span>Home</span></button><button onclick="nav('search')">🔍<span>Search</span></button><button onclick="nav('sell')">➕<span>Sell</span></button><button onclick="nav('cart')">🛒<span>Cart</span></button><button onclick="nav('profile')">👤<span>Profile</span></button></div>${footer()}</div>`

function footer(){return `<footer class="footer"><div><h2>RETECH</h2><p>Smart refurbished technology for smarter prices.</p><p>© 2026 RETECH Demo Marketplace</p></div><div><h3>Marketplace</h3><button onclick="nav('search')">Search Laptops</button><button onclick="nav('sell')">Sell Your Laptop</button><button onclick="nav('upload')">Upload Laptop</button></div><div><h3>Support</h3><button onclick="toast('Warranty policy: demo 6–12 month coverage')">Warranty</button><button onclick="toast('Return policy: demo 7-day return')">Return Policy</button><button onclick="toast('Help Center demo')">Help Center</button></div><div><h3>Connect</h3><button>Instagram</button><button>YouTube</button><button>LinkedIn</button></div></footer>`}
function productCard(p){const wish=db.wishlist.includes(p.id),cmp=db.compare.includes(p.id);return `<article class="product-card"><div class="product-img" onclick="details(${p.id})">${laptopVisual(p.brand)}<button class="heart" onclick="event.stopPropagation();toggleWish(${p.id})">${wish?"♥":"♡"}</button></div><div class="product-body"><div class="muted">${p.brand} · ${p.condition}</div><h3 style="margin:5px 0">${p.name}</h3><div class="muted">${p.processor} · ${p.ram} · ${p.storage}</div><div class="badges"><span class="badge green">✓ Verified</span><span class="badge">${p.warranty}</span><span class="badge">Trust ${p.trustScore}</span></div><div><span class="price">${money(p.price)}</span> <span class="old">${money(p.oldPrice)}</span> <span class="discount">${p.discount}% OFF</span></div><div class="muted">★ ${p.rating} (${p.reviews}) · ${p.seller}</div><div class="card-actions"><button class="btn btn-outline" onclick="details(${p.id})">View Details</button><button class="btn btn-primary" onclick="addCart(${p.id})">Add to Cart</button></div><button class="btn btn-outline" style="width:100%;margin-top:7px" onclick="toggleCompare(${p.id})">${cmp?"✓ Added to Compare":"⇄ Compare Now"}</button></div></article>`}
function renderHome(){let cats=["All","Personal","Gaming","Business","Student","Coding","MacBook","Under ₹40K","Under ₹60K","Under ₹80K"];app.innerHTML=shell(`<section class="hero"><div><div class="badges"><span class="badge">RETECH VERIFIED MARKETPLACE</span></div><h1>Premium refurbished laptops.<br>Smarter prices.</h1><p>Tested, certified and ready for a second life. Discover laptops and MacBooks selected for work, study, gaming and coding.</p><div class="cta-row"><button class="btn btn-primary" onclick="nav('search')">Shop Laptops</button><button class="btn btn-light" onclick="filterCategory('MacBook')">Explore MacBooks</button></div></div><div class="hero-visual"><div class="hero-laptop"></div></div></section><div class="banner-strip"><div class="trust-box">✓ Quality Checked</div><div class="trust-box">✓ Verified Sellers</div><div class="trust-box">✓ Warranty Available</div><div class="trust-box">✓ 7-Day Return</div></div><section class="section"><div class="section-head"><h2>Shop by Brand</h2><span class="muted">Explore</span></div><div class="brand-grid">${["HP","Dell","Lenovo","ASUS","Acer","MSI","Apple"].map(b=>`<div class="brand-card" onclick="filterBrand('${b}')"><div class="brand-img">${laptopVisual(b)}</div><b>${b}</b><div class="muted">Explore →</div></div>`).join("")}</div></section><section class="section"><div class="section-head"><h2>Quick Categories</h2></div><div class="chips">${cats.map(c=>`<button class="chip" onclick="filterCategory('${c}')">${c}</button>`).join("")}</div></section><section class="section"><div class="section-head"><h2>Featured Deals</h2><button class="link" onclick="nav('search')">View all</button></div><div class="product-grid">${products.slice(0,8).map(productCard).join("")}</div></section><section class="section"><div class="section-head"><h2>Today's Refurbished Deals</h2><b id="dealTimer">12:00:00</b></div><div class="product-grid">${products.slice(4,8).map(productCard).join("")}</div></section><section class="section"><div class="section-head"><h2>MacBook Deals</h2><button class="link" onclick="filterCategory('MacBook')">See MacBooks</button></div><div class="product-grid">${products.filter(p=>p.brand==="Apple").map(productCard).join("")}</div></section>`);startTimer()}
function startTimer(){let e=$("#dealTimer");if(!e)return;let end=Date.now()+12*3600000;setInterval(()=>{let s=Math.max(0,Math.floor((end-Date.now())/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;e.textContent=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`},1000)}
function filterBrand(b){renderListing(products.filter(p=>p.brand===b),`Brand: ${b}`)}

function renderListing(list,title){app.innerHTML=shell(`<div class="section-head"><h1 class="page-title">${title}</h1><button class="btn btn-outline" onclick="nav('compare')">⇄ Compare (${db.compare.length})</button></div><div class="filters"><select onchange="applyFilter()"><option value="">All Brands</option>${["HP","Dell","Lenovo","ASUS","Acer","MSI","Apple"].map(x=>`<option>${x}</option>`).join("")}</select><select onchange="applyFilter()"><option value="">All RAM</option><option>8 GB</option><option>16 GB</option></select><select onchange="applyFilter()"><option value="">All Conditions</option><option>Excellent</option><option>Very Good</option><option>Good</option></select><select id="sort" onchange="applyFilter()"><option value="">Recommended</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="rating">Rating</option><option value="deal">Best Deals</option></select></div><div id="listing" class="product-grid" style="margin-top:18px">${list.map(productCard).join("")}</div>`);window.currentList=list}
function applyFilter(){let brand=document.querySelector(".filters select:nth-child(1)").value,ram=document.querySelector(".filters select:nth-child(2)").value,cond=document.querySelector(".filters select:nth-child(3)").value,sort=$("#sort").value;let list=(window.currentList||products).filter(p=>(!brand||p.brand===brand)&&(!ram||p.ram===ram)&&(!cond||p.condition===cond));if(sort==="low")list.sort((a,b)=>a.price-b.price);if(sort==="high")list.sort((a,b)=>b.price-a.price);if(sort==="rating")list.sort((a,b)=>b.rating-a.rating);if(sort==="deal")list.sort((a,b)=>b.discount-a.discount);$("#listing").innerHTML=list.map(productCard).join("")}
function searchFromHeader(q){if(q.trim())renderSearch(q.trim());else nav("search")}
function renderSearch(q=""){app.innerHTML=shell(`<h1 class="page-title">Search RETECH</h1><div class="field"><input id="searchInput" value="${q}" placeholder="Search brand, model, processor, RAM, storage or category..." oninput="liveSearch()"></div><div class="filters"><select id="brandF" onchange="liveSearch()"><option value="">Brand</option>${["HP","Dell","Lenovo","ASUS","Acer","MSI","Apple"].map(x=>`<option>${x}</option>`).join("")}</select><select id="ramF" onchange="liveSearch()"><option value="">RAM</option><option>8 GB</option><option>16 GB</option></select><select id="catF" onchange="liveSearch()"><option value="">Category</option><option>Gaming</option><option>Student</option><option>Business</option><option>MacBook</option><option>Coding</option></select><select id="sortF" onchange="liveSearch()"><option value="">Sort</option><option value="low">Price Low</option><option value="high">Price High</option><option value="rating">Rating</option></select></div><div id="searchResults" class="product-grid" style="margin-top:18px"></div>`);liveSearch()}
function liveSearch(){let q=$("#searchInput").value.toLowerCase(),b=$("#brandF").value,r=$("#ramF").value,c=$("#catF").value,s=$("#sortF").value;let list=products.filter(p=>(!q||JSON.stringify(p).toLowerCase().includes(q))&&(!b||p.brand===b)&&(!r||p.ram===r)&&(!c||p.category.includes(c)));if(s==="low")list.sort((a,b)=>a.price-b.price);if(s==="high")list.sort((a,b)=>b.price-a.price);if(s==="rating")list.sort((a,b)=>b.rating-a.rating);$("#searchResults").innerHTML=list.length?list.map(productCard).join(""):`<div class="empty" style="grid-column:1/-1">No matching laptops found.</div>`}
function details(id){let p=products.find(x=>x.id===id);db.recent=[id,...db.recent.filter(x=>x!==id)].slice(0,6);save();app.innerHTML=shell(`<div class="detail"><div><div class="gallery-main">${laptopVisual(p.brand)}</div><div class="thumbs">${["Front","Back","Keyboard","Side","Display"].map(x=>`<button class="thumb" onclick="toast('${x} view selected')">${x}</button>`).join("")}</div></div><div><div class="muted">${p.brand} · ${p.condition}</div><h1>${p.name}</h1><div>★ ${p.rating} · ${p.reviews} reviews</div><div style="margin:12px 0"><span class="price">${money(p.price)}</span> <span class="old">${money(p.oldPrice)}</span> <span class="discount">${p.discount}% OFF</span></div><div class="badges"><span class="badge green">✓ RETECH Verified</span><span class="badge">${p.warranty}</span><span class="badge">7-Day Return</span><span class="badge">Grade ${p.grade}</span></div><div class="field"><label>Colour</label><div class="chips">${p.colors.map(c=>`<button class="chip" onclick="toast('${c} selected')">${c}</button>`).join("")}</div></div><div class="score"><b>RETECH Trust Score ${p.trustScore}/100</b><div class="progress" style="margin-top:8px"><i style="width:${p.trustScore}%"></i></div><p class="muted">Quality Check · Battery Health · Condition · Warranty · Seller Rating</p></div><div class="score"><b>Battery Health ${p.batteryHealth}%</b><div class="progress" style="margin-top:8px"><i style="width:${p.batteryHealth}%"></i></div></div><div class="card-actions"><button class="btn btn-outline" onclick="toggleWish(${p.id})">♡ Wishlist</button><button class="btn btn-primary" onclick="addCart(${p.id})">Add to Cart</button><button class="btn btn-primary" onclick="buyNow(${p.id})">Buy Now</button></div><h3>Specifications</h3><div class="spec-grid">${[["Processor",p.processor],["RAM",p.ram],["Storage",p.storage],["GPU",p.gpu],["Display",p.display],["Refresh Rate",p.refreshRate],["OS",p.os],["Battery",p.batteryHealth+"%"],["Wi-Fi","Wi-Fi 6"],["Bluetooth","5.2"],["Ports","USB-C · HDMI · USB-A"],["Weight","1.6–2.2 kg"]].map(a=>`<div class="spec"><span class="muted">${a[0]}</span><br><b>${a[1]}</b></div>`).join("")}</div><h3>Refurbished Condition</h3><p><b>Grade ${p.grade} — ${p.condition}</b><br>Hardware, battery, display, keyboard, ports and storage checked; software reset and quality inspection completed.</p><h3>Seller</h3><div class="panel"><b>${p.seller}</b><p class="muted">★ 4.7 · 5+ years on RETECH · Verified Seller · 2,400+ products sold</p></div></div></div><section class="section"><div class="section-head"><h2>Reviews</h2><button class="btn btn-outline" onclick="reviewForm(${p.id})">Write Review</button></div><div class="product-grid">${[1,2,3].map((_,i)=>`<div class="panel"><b>★★★★★</b><p>Great refurbished device with excellent value and clean condition.</p><span class="muted">Verified buyer · ${i+2} weeks ago</span></div>`).join("")}</div></section><section class="section"><h2>You may also like</h2><div class="product-grid">${products.filter(x=>x.id!==id&&x.brand===p.brand).slice(0,4).map(productCard).join("")}</div></section>`)}
function reviewForm(id){const p=products.find(x=>x.id===id);document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="reviewModal"><div class="modal-card"><h2>Review ${p.name}</h2><div class="field"><label>Rating</label><select id="reviewRating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div><div class="field"><label>Your review</label><textarea id="reviewText" rows="4" placeholder="Share your experience"></textarea></div><button class="btn btn-primary" onclick="submitReview(${id})">Submit Review</button> <button class="btn btn-outline" onclick="$('#reviewModal').remove()">Cancel</button></div></div>`)}

function changeQty(id,d){let x=db.cart.find(a=>a.id===id);x.qty=Math.max(1,x.qty+d);save();renderCart()}

function renderWishlist(){let list=products.filter(p=>db.wishlist.includes(p.id));app.innerHTML=shell(`<h1 class="page-title">My Wishlist</h1>${list.length?`<div class="product-grid">${list.map(productCard).join("")}</div>`:`<div class="empty">No saved laptops yet.</div>`}`)}
function renderOrders(){app.innerHTML=shell(`<h1 class="page-title">My Orders</h1>${db.orders.length?db.orders.map(o=>`<div class="panel" style="margin-bottom:12px"><div class="section-head"><b>${o.id}</b><span class="badge green">${o.status}</span></div><div class="cart-row"><div class="mini-product">${laptopVisual((products.find(x=>x.name===o.name)||{}).brand)}</div><div><b>${o.name}</b><p class="muted">${money(o.price)} · Ordered ${o.date}</p><button class="btn btn-outline" onclick="track('${o.id}')">Track Order</button></div></div></div>`).join(""):`<div class="empty">No orders yet.</div>`}`)}

function renderCheckout(){let total=db.cart.reduce((s,i)=>s+products.find(p=>p.id===i.id).price*i.qty,0);app.innerHTML=shell(`<h1 class="page-title">Checkout</h1><div class="two-col"><div class="panel"><h2>Delivery Details</h2><div class="field"><label>Name</label><input id="cName" value="${db.user?.name||""}"></div><div class="field"><label>Mobile</label><input id="cMobile" value="${db.user?.mobile||""}"></div><div class="field"><label>Email</label><input id="cEmail" value="${db.user?.email||""}"></div><div class="field"><label>Address</label><textarea id="cAddress" rows="3"></textarea></div><div class="field"><label>City</label><input id="cCity"></div><div class="field"><label>State</label><input id="cState" value="Tamil Nadu"></div><div class="field"><label>Pincode</label><input id="cPin" maxlength="6"></div><h2>Payment</h2><div class="chips"><button class="chip active">UPI</button><button class="chip">Card</button><button class="chip">Cash on Delivery</button><button class="chip">EMI</button></div><p class="muted">Demo only — no real payment is processed.</p></div><div class="panel"><h2>Order Summary</h2>${db.cart.map(i=>{let p=products.find(x=>x.id===i.id);return `<p>${p.name} × ${i.qty}<b style="float:right">${money(p.price*i.qty)}</b></p>`}).join("")}<hr><h2>Total <span style="float:right">${money(total)}</span></h2><p>✓ Secure Payment<br>✓ Warranty<br>✓ 7-Day Return</p><button class="btn btn-primary" style="width:100%" onclick="placeOrder()">Place Order</button></div></div>`)}
function placeOrder(){if(!$("#cName").value||!$("#cAddress").value||$("#cPin").value.length!==6)return toast("Please complete delivery details.");let i=db.cart[0],p=products.find(x=>x.id===i.id);let o={id:"RT"+Date.now().toString().slice(-8),name:p.name,price:p.price*i.qty,date:new Date().toLocaleDateString(),delivery:new Date(Date.now()+6*864e5).toLocaleDateString(),status:"Order Confirmed",stage:3};db.orders.unshift(o);db.cart=[];save();app.innerHTML=shell(`<div class="panel" style="text-align:center;padding:55px"><div style="font-size:55px">✓</div><h1>Order Confirmed!</h1><p>Your demo order <b>${o.id}</b> has been placed successfully.</p><p class="muted">Estimated delivery: ${o.delivery}</p><button class="btn btn-primary" onclick="nav('orders')">View My Orders</button></div>`)}
function renderProfile(){app.innerHTML=shell(`<h1 class="page-title">My Profile</h1><div class="two-col"><div class="panel"><div style="font-size:55px">👤</div><h2>${db.user?.name}</h2><p>${db.user?.mobile}</p><p>${db.user?.email}</p><span class="badge green">RETECH Member</span></div><div class="panel">${["My Orders","Wishlist","Saved Laptops","Recently Viewed","My Reviews","Sell My Laptop","Upload Laptop","Settings"].map(x=>`<button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="${x==="My Orders"?"nav('orders')":x==="Wishlist"?"nav('wishlist')":x==="Sell My Laptop"?"nav('sell')":x==="Upload Laptop"?"nav('upload')":x==="Recently Viewed"?"showRecent()":"toast('Demo section ready')"}">${x}</button>`).join("")}<button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="logout()">Logout</button></div></div>`)}
function showRecent(){let list=products.filter(p=>db.recent.includes(p.id));app.innerHTML=shell(`<h1 class="page-title">Recently Viewed</h1><div class="product-grid">${list.length?list.map(productCard).join(""):`<div class="empty">No recently viewed laptops.</div>`}</div>`)}
function renderCompare(){let list=products.filter(p=>db.compare.includes(p.id));app.innerHTML=shell(`<h1 class="page-title">Compare Laptops</h1>${list.length?`<div class="table-wrap"><table class="compare-table"><tr><th>Specification</th>${list.map(p=>`<th>${p.name}<br>${money(p.price)}</th>`).join("")}</tr>${[["Processor","processor"],["RAM","ram"],["Storage","storage"],["GPU","gpu"],["Display","display"],["Refresh Rate","refreshRate"],["Battery","batteryHealth"],["Condition","condition"],["Warranty","warranty"],["Trust Score","trustScore"]].map(r=>`<tr><th>${r[0]}</th>${list.map(p=>`<td>${p[r[1]]}${r[1]==="trustScore"?"/100":""}</td>`).join("")}</tr>`).join("")}</table></div><p class="muted">Best-value highlights are based on demo product data.</p>`:`<div class="empty">Select up to 3 products using “Compare Now”.</div>`}`)}
function toggleCompare(id){if(db.compare.includes(id))db.compare=db.compare.filter(x=>x!==id);else if(db.compare.length<3)db.compare.push(id);else return toast("Compare supports up to 3 laptops.");save();toast("Compare list updated");}
function renderUpload(){app.innerHTML=shell(`<h1 class="page-title">Upload Your Laptop</h1><div class="panel"><p>Upload a photo and discover its estimated refurbished value.</p><div class="upload"><div style="font-size:42px">📷</div><b>Upload Laptop Image</b><p class="muted">JPG · JPEG · PNG · WEBP</p><input id="uploadFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewUpload(this)"><div id="uploadPreview"></div></div><div id="analysis"></div></div>`)}
function previewUpload(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{$("#uploadPreview").innerHTML=`<img class="preview" src="${e.target.result}"><button class="btn btn-primary" onclick="mockAnalysis()">Analyze Demo Image</button>`;db.upload=e.target.result;save()};r.readAsDataURL(f)}
function mockAnalysis(){$("#analysis").innerHTML=`<div class="panel" style="margin-top:15px;text-align:center"><div class="progress"><i style="width:100%"></i></div><p>Analyzing demo image...</p></div>`;setTimeout(()=>{$("#analysis").innerHTML=`<div class="panel" style="margin-top:15px"><span class="badge green">DEMO ESTIMATE</span><h2>Laptop Detected</h2><p><b>Brand:</b> HP<br><b>Possible Model:</b> HP Victus<br><b>Condition:</b> Good</p><p><b>Estimated Specifications:</b><br>Intel Core processor · 16 GB RAM · 512 GB SSD · RTX 3050</p><h2>₹65,000 – ₹80,000</h2><p class="muted">This is a demo estimate. Real identification should use a connected AI/computer-vision API.</p></div>`},1000)}
function renderSell(){app.innerHTML=shell(`<h1 class="page-title">Sell Your Laptop</h1><div class="panel"><p>Tell us about your device and get a demo selling-price estimate.</p><div class="spec-grid"><div class="field"><label>Name</label><input id="sName"></div><div class="field"><label>Mobile</label><input id="sMobile"></div><div class="field"><label>Email</label><input id="sEmail"></div><div class="field"><label>Brand</label><select id="sBrand"><option>HP</option><option>Dell</option><option>Lenovo</option><option>ASUS</option><option>Acer</option><option>MSI</option><option>Apple</option></select></div><div class="field"><label>Model</label><input id="sModel"></div><div class="field"><label>Processor</label><input id="sProc"></div><div class="field"><label>RAM</label><input id="sRam" placeholder="16 GB"></div><div class="field"><label>Storage</label><input id="sStorage" placeholder="512 GB SSD"></div><div class="field"><label>GPU</label><input id="sGpu"></div><div class="field"><label>Purchase Year</label><input id="sYear" type="number" value="2024"></div><div class="field"><label>Condition</label><select id="sCond"><option>Excellent</option><option>Very Good</option><option>Good</option></select></div><div class="field"><label>Battery Condition</label><select id="sBattery"><option>Excellent</option><option>Good</option><option>Fair</option></select></div><div class="field"><label>Expected Price</label><input id="sExpected" type="number"></div><div class="field"><label>Laptop Photos</label><input type="file" multiple accept="image/*"></div></div><button class="btn btn-primary" onclick="estimateSell()">Get Estimated Price</button><div id="sellResult"></div></div>`)}
function estimateSell(){let brand=$("#sBrand").value,base={HP:52000,Dell:50000,Lenovo:55000,ASUS:57000,Acer:42000,MSI:65000,Apple:85000}[brand];let adj=$("#sCond").value==="Excellent"?1.1:$("#sCond").value==="Good"?.9:1;let low=Math.round(base*adj/1000)*1000;let high=low+12000;db.form={brand,model:$("#sModel").value};save();$("#sellResult").innerHTML=`<div class="score" style="margin-top:18px"><span class="badge green">DEMO ESTIMATE</span><h2>Estimated Selling Price</h2><h1>${money(low)} – ${money(high)}</h1><p class="muted">Final value depends on physical inspection, serial verification, battery health and market demand.</p></div>`}
function logout(){db.loggedIn=false;save();renderSplash()}
render();

</script>
</body>
</html>
